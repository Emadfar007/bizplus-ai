[build]
  command = "npm run build:frontend"
  publish = "frontend/dist"
[build.environment]
  NODE_VERSION = "24.19.0"
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
