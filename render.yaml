services:
  - type: web
    name: bizplus-ai-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build:backend
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: HISTORY_POLICY
        value: temporary
      - key: DATABASE_PATH
        value: .local/bizplus.sqlite
      - key: SERVE_FRONTEND
        value: "true"
      - key: VITE_API_BASE_URL
        value: https://bizplus-ai-api.onrender.com
      - key: CORS_ORIGIN
        value: https://bizplus-ai-api.onrender.com
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
